<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lelemuku Monitor — Peta Berita Indonesia</title>
<meta name="description" content="Pantau berita terkini Lelemuku.com secara real-time pada peta interaktif Indonesia">
<link rel="icon" type="image/x-icon" href="https://www.lelemuku.com/favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ... (semua CSS lama tetap sama sampai akhir style) ... */

/* PERBAIKAN WIRE PANEL & POPUP */
#wire-panel {
  z-index: 750;
}
@media (max-width: 768px) {
  #wire-panel { z-index: 1250; }
}
.leaflet-popup {
  z-index: 2000 !important;
}
.leaflet-popup-content-wrapper {
  border-radius: 10px !important;
}
#wire-handle {
  z-index: 1300;
}
</style>
</head>
<body>
<!-- HEADER (link sudah diubah ke monitor.lelemuku.com) -->
<div id="header">
  <a id="logo-wrap" href="https://monitor.lelemuku.com">
    <img id="logo-img" src="https://www.lelemuku.com/favicon.ico" alt="L">
    <div>
      <div id="logo-name">Lelemuku Monitor</div>
      <div id="logo-tag">Peta Berita Indonesia</div>
    </div>
  </a>
  <!-- ... sisanya header sama ... -->
</div>

<!-- ... SEMUA HTML di bawahnya SAMA persis sampai </style> ... -->

<script>
// ══════════════════════════════════════════════
// KONFIGURASI (UPDATE Apps Script Anda di sini)
const CFG = {
  appsScriptUrl: 'https://script.google.com/macros/s/[PASTE_WEB_APP_URL_BARU_ANDA]/exec',  // ← GANTI DENGAN URL BARU
  feeds: ['https://www.lelemuku.com/feeds/posts/default?alt=rss&max-results=50'],
  refreshMs: 5 * 60 * 1000,
};

// ... (semua variabel LOC, CATS, dll tetap sama) ...

// PERBAIKAN FETCH (rss2json diprioritaskan setelah Apps Script)
async function fetchFeed(feedUrl){
  // 1. Apps Script (sekarang sudah diperbaiki)
  if(CFG.appsScriptUrl){
    try{
      const r=await tryFetch(`${https://script.google.com/macros/s/AKfycbwsdZnMevE5RejESqh03Tr2Ala7CWivP1FVinxDdXR-aCbk44tK_XQSEOYNArA8-sIl/exec}?url=${encodeURIComponent(feedUrl)}`);
      const j=await r.json();
      if(j.content) return {text:j.content,src:'Apps Script'};
    }catch(e){console.warn('Apps Script:',e.message);}
  }
  // 2. rss2json (paling reliable & cepat)
  try{
    const r=await tryFetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}&count=50`);
    const j=await r.json();
    if(j.status==='ok'&&j.items?.length) return {text:JSON.stringify(j),src:'rss2json',isJson:true};
  }catch(e){console.warn('rss2json:',e.message);}

  // 3-5. sisanya tetap (allorigins, corsproxy)
  // ... (kode lama tetap sama) ...
}

// ... (semua fungsi lain tetap sama, hanya tambahan kecil di toggleWireDesktop & clickWire)

function toggleWireDesktop(){
  wirePanelOpen=!wirePanelOpen;
  const panel=document.getElementById('wire-panel');
  const arrow=document.getElementById('handle-arrow');
  panel.classList.toggle('collapsed',!wirePanelOpen);
  arrow.textContent=wirePanelOpen?'▶':'◀';
  // pastikan map tetap responsif
  if(mapObj) mapObj.invalidateSize();
}

function clickWire(id){
  const n=allNews.find(x=>x.id===id); if(!n) return;
  setActive(id);
  if(n.loc){
    mapObj.flyTo([n.loc.lat,n.loc.lng],10,{duration:1.2});
    const m=mapMarkers.find(x=>x.news.id===id);
    if(m) setTimeout(()=>m.m.openPopup(),800); // popup lebih cepat muncul
  }
  if(window.innerWidth<=768) setTimeout(()=>toggleWireMobile(false),600);
}

// INIT (tambah invalidateSize agar map tidak "rusak" saat panel slide)
window.addEventListener('DOMContentLoaded',()=>{
  // ... kode lama ...
  initMap();
  loadData();
  setInterval(tick,1000); tick();
  if(CFG.refreshMs>0) setInterval(loadData,CFG.refreshMs);
  
  // tambahan: resize map saat window berubah
  window.addEventListener('resize',()=>{ if(mapObj) mapObj.invalidateSize(); });
});
</script>
</body>
</html>
