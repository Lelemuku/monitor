<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lelemuku Monitor — Peta Berita Indonesia</title>
<meta name="description" content="Pantau berita terkini dari seluruh Indonesia secara real-time di peta interaktif Lelemuku Monitor">
<meta property="og:title" content="Lelemuku Monitor — Peta Berita Indonesia">
<meta property="og:description" content="Berita terkini dari Lelemuku.com divisualisasikan secara real-time pada peta Indonesia">
<meta property="og:url" content="https://monitor.lelemuku.com">

<!-- Leaflet.js - Peta interaktif (gratis, open source) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #0a0e1a;
  --bg-card: #111827;
  --bg-card2: #1a2236;
  --border: rgba(255,255,255,0.08);
  --border-bright: rgba(255,255,255,0.15);
  --text-primary: #f0f4ff;
  --text-secondary: #8b9ab8;
  --text-muted: #4a5a78;
  --accent-gold: #f5c842;
  --accent-blue: #3b82f6;
  --accent-green: #22c55e;
  --accent-red: #ef4444;
  --accent-orange: #f97316;
  --font-head: 'Sora', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-dark);
  color: var(--text-primary);
  font-family: var(--font-body);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
#header {
  height: 56px;
  background: linear-gradient(90deg, #0d1526 0%, #0f172a 100%);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 1000;
  flex-shrink: 0;
}

#logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

#logo-icon {
  width: 34px;
  height: 34px;
  background: linear-gradient(135deg, #f5c842, #f97316);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: #0a0e1a;
  font-family: var(--font-head);
  flex-shrink: 0;
}

#logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

#logo-name {
  font-family: var(--font-head);
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}

#logo-sub {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

#header-divider {
  width: 1px;
  height: 28px;
  background: var(--border);
}

#live-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--accent-green);
  font-weight: 600;
  letter-spacing: 0.05em;
}

#live-dot {
  width: 7px;
  height: 7px;
  background: var(--accent-green);
  border-radius: 50%;
  animation: pulse-live 2s infinite;
}

@keyframes pulse-live {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

#header-stats {
  display: flex;
  gap: 16px;
  margin-left: auto;
  align-items: center;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-secondary);
}

.stat-pill strong {
  color: var(--text-primary);
  font-weight: 600;
}

#btn-refresh {
  background: rgba(59,130,246,0.15);
  border: 1px solid rgba(59,130,246,0.3);
  border-radius: 6px;
  color: var(--accent-blue);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
}

#btn-refresh:hover {
  background: rgba(59,130,246,0.25);
}

/* ===== MAIN LAYOUT ===== */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ===== MAP ===== */
#map-container {
  flex: 1;
  position: relative;
}

#map {
  width: 100%;
  height: 100%;
}

/* Leaflet overrides */
.leaflet-container {
  background: #060c1a !important;
  font-family: var(--font-body);
}

.leaflet-control-zoom {
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  overflow: hidden;
}

.leaflet-control-zoom a {
  background: var(--bg-card) !important;
  color: var(--text-secondary) !important;
  border-bottom: 1px solid var(--border) !important;
}

.leaflet-control-zoom a:hover {
  background: var(--bg-card2) !important;
  color: var(--text-primary) !important;
}

.leaflet-control-attribution {
  background: rgba(10,14,26,0.8) !important;
  color: var(--text-muted) !important;
  font-size: 9px !important;
}

.leaflet-control-attribution a {
  color: var(--text-muted) !important;
}

/* ===== CUSTOM MARKERS ===== */
.news-marker {
  position: relative;
  cursor: pointer;
}

.marker-ring {
  position: absolute;
  border-radius: 50%;
  animation: ring-pulse 2.5s ease-out infinite;
  pointer-events: none;
}

@keyframes ring-pulse {
  0% { transform: scale(0.8); opacity: 0.8; }
  70% { transform: scale(2.5); opacity: 0; }
  100% { transform: scale(2.5); opacity: 0; }
}

.marker-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  position: relative;
  z-index: 2;
  cursor: pointer;
  transition: transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 7px;
  font-weight: 700;
}

.marker-dot:hover {
  transform: scale(1.4);
}

.marker-dot.urgent { background: var(--accent-red); box-shadow: 0 0 10px rgba(239,68,68,0.6); }
.marker-dot.regular { background: var(--accent-gold); box-shadow: 0 0 10px rgba(245,200,66,0.6); }
.marker-dot.info { background: var(--accent-green); box-shadow: 0 0 10px rgba(34,197,94,0.6); }
.marker-dot.breaking { background: var(--accent-orange); box-shadow: 0 0 10px rgba(249,115,22,0.6); }

/* ===== POPUP ===== */
.leaflet-popup-content-wrapper {
  background: var(--bg-card) !important;
  border: 1px solid var(--border-bright) !important;
  border-radius: 12px !important;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6) !important;
  padding: 0 !important;
}

.leaflet-popup-tip-container { display: none; }

.leaflet-popup-content {
  margin: 0 !important;
  width: 300px !important;
}

.popup-inner {
  padding: 16px;
}

.popup-category {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 10px;
}

.cat-urgent { background: rgba(239,68,68,0.2); color: #fca5a5; }
.cat-regular { background: rgba(245,200,66,0.2); color: #fde68a; }
.cat-info { background: rgba(34,197,94,0.2); color: #86efac; }
.cat-breaking { background: rgba(249,115,22,0.2); color: #fdba74; }

.popup-title {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
  margin-bottom: 8px;
}

.popup-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.popup-meta-dot { color: var(--border-bright); }

.popup-excerpt {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.popup-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(59,130,246,0.15);
  border: 1px solid rgba(59,130,246,0.3);
  border-radius: 6px;
  color: #93c5fd;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 12px;
  text-decoration: none;
  transition: all 0.2s;
}

.popup-link:hover {
  background: rgba(59,130,246,0.25);
  color: #bfdbfe;
}

.popup-image {
  width: 100%;
  height: 130px;
  object-fit: cover;
  border-radius: 8px 8px 0 0;
  display: block;
}

.popup-image-fallback {
  width: 100%;
  height: 80px;
  background: linear-gradient(135deg, #1a2236, #0d1526);
  border-radius: 8px 8px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

/* ===== SIDEBAR ===== */
#sidebar {
  width: 320px;
  background: var(--bg-card);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

#sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#sidebar-title {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

#filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-btn {
  font-size: 10px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-body);
  transition: all 0.2s;
  letter-spacing: 0.03em;
}

.filter-btn:hover { background: rgba(255,255,255,0.05); }
.filter-btn.active-all { background: rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.4); color: #93c5fd; }
.filter-btn.active-breaking { background: rgba(249,115,22,0.2); border-color: rgba(249,115,22,0.4); color: #fdba74; }
.filter-btn.active-urgent { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
.filter-btn.active-regular { background: rgba(245,200,66,0.2); border-color: rgba(245,200,66,0.4); color: #fde68a; }
.filter-btn.active-info { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.4); color: #86efac; }

#news-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

#news-list::-webkit-scrollbar { width: 4px; }
#news-list::-webkit-scrollbar-track { background: transparent; }
#news-list::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

.news-item {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.news-item:hover { background: rgba(255,255,255,0.04); }
.news-item.active { background: rgba(59,130,246,0.08); border-left: 2px solid var(--accent-blue); }

.news-item-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 3px;
  flex-shrink: 0;
}

.news-item-content { flex: 1; min-width: 0; }

.news-item-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.news-item-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--text-muted);
}

.news-location-tag {
  background: rgba(255,255,255,0.06);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 9px;
  letter-spacing: 0.03em;
}

/* ===== LEGEND ===== */
#legend {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg-dark);
  flex-shrink: 0;
}

#legend-title {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

#legend-items {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--text-secondary);
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* ===== BOTTOM TICKER ===== */
#ticker {
  height: 34px;
  background: rgba(5,10,20,0.9);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  overflow: hidden;
  flex-shrink: 0;
  z-index: 100;
}

#ticker-label {
  padding: 0 12px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent-gold);
  border-right: 1px solid var(--border);
  white-space: nowrap;
  flex-shrink: 0;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
}

#ticker-scroll {
  flex: 1;
  overflow: hidden;
  height: 100%;
  position: relative;
}

#ticker-inner {
  display: flex;
  align-items: center;
  gap: 0;
  white-space: nowrap;
  animation: scroll-left 60s linear infinite;
  height: 100%;
  position: absolute;
}

@keyframes scroll-left {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

#ticker-inner:hover { animation-play-state: paused; }

.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 24px;
  font-size: 11px;
  color: var(--text-secondary);
  border-right: 1px solid var(--border);
  height: 100%;
  cursor: pointer;
  transition: color 0.2s;
}

.ticker-item:hover { color: var(--text-primary); }

.ticker-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ===== MAP OVERLAYS ===== */
#map-loading {
  position: absolute;
  inset: 0;
  background: rgba(10,14,26,0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  gap: 16px;
  transition: opacity 0.5s;
}

#map-loading.hidden { opacity: 0; pointer-events: none; }

.loader-ring {
  width: 44px;
  height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--accent-gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loader-text {
  font-size: 13px;
  color: var(--text-secondary);
  font-family: var(--font-head);
}

#toast-container {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: var(--bg-card2);
  border: 1px solid var(--border-bright);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 12px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 260px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  animation: toast-in 0.3s ease;
  pointer-events: auto;
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

.toast.fade-out { animation: toast-out 0.4s ease forwards; }

@keyframes toast-out {
  to { opacity: 0; transform: translateY(-12px); }
}

/* ===== STATUS BAR ===== */
#statusbar {
  position: absolute;
  bottom: 10px;
  left: 10px;
  z-index: 500;
  background: rgba(10,14,26,0.85);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 10px;
  color: var(--text-muted);
  backdrop-filter: blur(8px);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  #sidebar { display: none; }
  #logo-sub { display: none; }
  #header-stats .stat-pill:not(:first-child) { display: none; }
}

/* ===== ERROR STATE ===== */
#error-banner {
  display: none;
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 12px;
  color: #fca5a5;
  z-index: 2000;
  text-align: center;
}
</style>
</head>

<script>
// ================================================================
// KONFIGURASI - Sesuaikan sesuai kebutuhan
// ================================================================
const CONFIG = {
  // Feed RSS Lelemuku.com via CORS proxy gratis
  feedUrl: 'https://script.google.com/macros/s/AKfycbw55rdanXDke38L0FtpGc_2ECM5IJSYW-lqbacLEoty3Y6RxR1CTinXwPGPDmHSZuD7/exec',
  
  // CORS proxies gratis (akan dicoba berurutan)
  corsProxies: [
    'https://api.allorigins.win/get?url=',
    'https://corsproxy.io/?',
    'https://cors-anywhere-demo.vercel.app/',
  ],
  
  // Interval auto-refresh (milidetik) - 5 menit
  refreshInterval: 5 * 60 * 1000,
  
  // Jumlah berita per halaman pada ticker
  maxTicker: 20,
};

// ================================================================
// DATABASE LOKASI - Kata kunci & koordinat wilayah Indonesia
// ================================================================
const LOCATION_DB = {

  { type: 'breaking', color: '#f97316', keywords: ['breaking', 'terkini', 'gempa', 'banjir', 'tsunami', 'longsor', 'kebakaran', 'kecelakaan', 'darurat', 'bencana', 'ledakan', 'demo', 'bentrok', 'konflik', 'meninggal', 'korban', 'penembakan'] },

function initMap() {

    center: [-2.5, 118.5],

  map.fitBounds([[-11.5, 94.5], [6.5, 141.5]]);

// ================================================================
// PARSING FEED RSS
// ================================================================
function categorizeNews(title, content) {
  const text = (title + ' ' + content).toLowerCase();
  for (const cat of CATEGORY_RULES) {
    if (cat.keywords.some(kw => text.includes(kw))) {
      return cat;
    }
  }
  return { type: 'regular', color: '#f5c842', keywords: [] };
}

function detectLocation(title, content) {
  const text = (title + ' ' + content).toLowerCase();
  
  // Sort by keyword length (longer = more specific)
  const sorted = Object.entries(LOCATION_DB).sort((a, b) => b[0].length - a[0].length);
  
  for (const [keyword, data] of sorted) {
    if (text.includes(keyword)) {
      // Add small random jitter to avoid all markers at exactly the same location
      const jitter = () => (Math.random() - 0.5) * 0.3;
      return {
        lat: data[0] + jitter(),
        lng: data[1] + jitter(),
        name: data[2],
      };
    }
  }
  
  // Default: random location on Indonesian territory for unmatched items
  return null;
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function extractImage(html) {
  const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  return match ? match[1] : null;
}

function timeAgo(dateStr) {
  const date = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - date) / 1000);
  if (diff < 60) return `${diff}d lalu`;
  if (diff < 3600) return `${Math.floor(diff/60)}m lalu`;
  if (diff < 86400) return `${Math.floor(diff/3600)}j lalu`;
  return `${Math.floor(diff/86400)}h lalu`;
}

async function fetchFeedWithProxy(proxyUrl, feedUrl) {
  const url = proxyUrl + encodeURIComponent(feedUrl);
  const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const data = await response.json();
  // allorigins format
  if (data.contents) return data.contents;
  // corsproxy format
  return data;
}

async function loadFeed() {
  showLoading(true);
  clearMarkers();

  let xmlText = null;
  let usedProxy = null;

  // Coba setiap proxy
  for (const proxy of CONFIG.corsProxies) {
    try {
      xmlText = await fetchFeedWithProxy(proxy, CONFIG.feedUrl);
      usedProxy = proxy;
      break;
    } catch (e) {
      console.warn(`Proxy gagal: ${proxy}`, e);
    }
  }

  if (!xmlText) {
    // Fallback: gunakan data contoh
    document.getElementById('error-banner').style.display = 'block';
    setTimeout(() => document.getElementById('error-banner').style.display = 'none', 5000);
    loadSampleData();
    showLoading(false);
    return;
  }

  // Parse XML
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, 'application/xml');
  const items = xml.querySelectorAll('item');

  newsItems = [];
  let locatedCount = 0;

  items.forEach((item, idx) => {
    const title = item.querySelector('title')?.textContent?.trim() || '';
    const link = item.querySelector('link')?.textContent?.trim() || '#';
    const pubDate = item.querySelector('pubDate')?.textContent || '';
    const descEl = item.querySelector('description');
    const description = descEl ? descEl.textContent : '';
    const contentEl = item.querySelector('encoded') || item.querySelector('content\\:encoded');
    const content = contentEl ? contentEl.textContent : description;

    const cleanDesc = stripHtml(description).substring(0, 300);
    const image = extractImage(content) || extractImage(description);
    const category = categorizeNews(title, title + ' ' + cleanDesc);
    const location = detectLocation(title, cleanDesc);

    const newsItem = {
      id: idx,
      title,
      link,
      pubDate,
      description: cleanDesc,
      image,
      category,
      location,
    };

    newsItems.push(newsItem);
    if (location) locatedCount++;
  });

  // Tambahkan marker ke peta
  newsItems.filter(n => n.location).forEach(n => addMarker(n));

  // Update sidebar
  renderNewsList();
  renderTicker();

  // Update stats
  document.getElementById('stat-total').textContent = newsItems.length;
  document.getElementById('stat-time').textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

  showLoading(false);
  showToast(`✅ ${locatedCount} berita dipetakan dari ${newsItems.length} total`);

  console.log(`Feed dimuat via: ${usedProxy}`);
}

// ================================================================
// MARKER MANAGEMENT
// ================================================================
function addMarker(news) {
  const { lat, lng } = news.location;
  const color = news.category.color;
  const type = news.category.type;

  const markerHtml = `
    <div class="news-marker">
      <div class="marker-ring" style="
        width:14px;height:14px;
        background:${color};
        top:0;left:0;
        opacity:0.4;
      "></div>
      <div class="marker-dot ${type}" data-id="${news.id}">
      </div>
    </div>
  `;

  const icon = L.divIcon({
    html: markerHtml,
    className: '',
    iconSize: [14, 14],
    iconAnchor: [7, 7],
    popupAnchor: [0, -14],
  });

  const marker = L.marker([lat, lng], { icon })
    .addTo(map)
    .bindPopup(buildPopup(news), {
      maxWidth: 320,
      className: 'news-popup',
    });

  marker.on('click', () => {
    setActiveNewsItem(news.id);
  });

  markers.push({ marker, news });
}

function buildPopup(news) {
  const imgHtml = news.image
    ? `<img class="popup-image" src="${news.image}" alt="" onerror="this.parentNode.querySelector('.popup-image-fallback').style.display='flex';this.remove()">`
    : '';
  
  const fallbackEmoji = { breaking: '🔴', urgent: '⚠️', regular: '📰', info: '✅' }[news.category.type] || '📰';

  return `
    <div>
      ${imgHtml}
      <div class="popup-image-fallback" style="${news.image ? 'display:none' : ''}">
        <span style="font-size:32px">${fallbackEmoji}</span>
      </div>
      <div class="popup-inner">
        <span class="popup-category cat-${news.category.type}">
          ${news.category.type === 'breaking' ? '🔴 BREAKING' :
            news.category.type === 'urgent' ? '🟡 PENTING' :
            news.category.type === 'info' ? '🟢 INFO' : '📰 UMUM'}
        </span>
        <div class="popup-title">${news.title}</div>
        <div class="popup-meta">
          <span>📍 ${news.location.name}</span>
          <span class="popup-meta-dot">·</span>
          <span>🕐 ${timeAgo(news.pubDate)}</span>
        </div>
        <div class="popup-excerpt">${news.description}</div>
        <a class="popup-link" href="${news.link}" target="_blank" rel="noopener">
          Baca selengkapnya →
        </a>
      </div>
    </div>
  `;
}

function clearMarkers() {
  markers.forEach(({ marker }) => map.removeLayer(marker));
  markers = [];
}

// ================================================================
// SIDEBAR NEWS LIST
// ================================================================
function renderNewsList() {
  const container = document.getElementById('news-list');
  const filtered = activeFilter === 'all'
    ? newsItems
    : newsItems.filter(n => n.category.type === activeFilter);

  container.innerHTML = '';

  if (filtered.length === 0) {
    container.innerHTML = `<div style="padding:24px 16px;text-align:center;color:var(--text-muted);font-size:12px">Tidak ada berita ditemukan</div>`;
    return;
  }

  filtered.forEach(news => {
    const div = document.createElement('div');
    div.className = `news-item${activeMarkerId === news.id ? ' active' : ''}`;
    div.dataset.id = news.id;
    div.innerHTML = `
      <div class="news-item-dot" style="background:${news.category.color}"></div>
      <div class="news-item-content">
        <div class="news-item-title">${news.title}</div>
        <div class="news-item-meta">
          ${news.location ? `<span class="news-location-tag">📍 ${news.location.name}</span>` : ''}
          <span>${timeAgo(news.pubDate)}</span>
        </div>
      </div>
    `;
    div.onclick = () => {
      if (news.location) {
        map.setView([news.location.lat, news.location.lng], 9, { animate: true });
        const m = markers.find(m => m.news.id === news.id);
        if (m) m.marker.openPopup();
      }
      setActiveNewsItem(news.id);
    };
    container.appendChild(div);
  });
}

function setActiveNewsItem(id) {
  activeMarkerId = id;
  document.querySelectorAll('.news-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.id) === id);
  });
  // Scroll to item in sidebar
  const activeEl = document.querySelector('.news-item.active');
  if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.className = 'filter-btn');
  btn.className = `filter-btn active-${filter}`;
  renderNewsList();
  
  // Show/hide markers based on filter
  markers.forEach(({ marker, news }) => {
    if (filter === 'all' || news.category.type === filter) {
      marker.getElement()?.style.setProperty('display', 'block');
    } else {
      marker.getElement()?.style.setProperty('display', 'none');
    }
  });
}

// ================================================================
// TICKER
// ================================================================
function renderTicker() {
  const inner = document.getElementById('ticker-inner');
  const items = newsItems.slice(0, CONFIG.maxTicker);
  
  const html = [...items, ...items].map(news => `
    <div class="ticker-item" onclick="flyToNews(${news.id})">
      <div class="ticker-dot" style="background:${news.category.color}"></div>
      <span>${news.title}</span>
      <span style="opacity:0.4">${news.location ? '· ' + news.location.name : ''}</span>
    </div>
  `).join('');
  
  inner.innerHTML = html;
}

function flyToNews(id) {
  const news = newsItems.find(n => n.id === id);
  if (!news?.location) return;
  map.flyTo([news.location.lat, news.location.lng], 10, { duration: 1.5 });
  const m = markers.find(m => m.news.id === id);
  if (m) setTimeout(() => m.marker.openPopup(), 1600);
  setActiveNewsItem(id);
}

// ================================================================
// UI UTILITIES
// ================================================================
function showLoading(show) {
  const el = document.getElementById('map-loading');
  el.classList.toggle('hidden', !show);
}

function showToast(msg, duration = 4000) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => toast.remove(), 400);
  }, duration);
}

  newsItems = samples.map((s, idx) => {
    const locData = LOCATION_DB[s.location];
    const jitter = () => (Math.random() - 0.5) * 0.4;
    const catData = CATEGORY_RULES.find(c => c.type === s.type) || { type: 'regular', color: '#f5c842' };
    return {
      id: idx,
      title: s.title,
      link: 'https://lelemuku.com',
      pubDate: s.date.toISOString(),
      description: `Berita dari Lelemuku.com: ${s.title}. Klik untuk membaca selengkapnya di portal berita Lelemuku.`,
      image: null,
      category: catData,
      location: locData ? { lat: locData[0] + jitter(), lng: locData[1] + jitter(), name: locData[2] } : null,
    };
  });

  newsItems.filter(n => n.location).forEach(n => addMarker(n));
  renderNewsList();
  renderTicker();

  document.getElementById('stat-total').textContent = newsItems.length;
  document.getElementById('stat-time').textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

// ================================================================
// AUTO REFRESH & NOTIFIKASI BERITA BARU
// ================================================================
let previousTitles = new Set();

function setupAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async () => {
    const prevCount = newsItems.length;
    await loadFeed();
    const newItems = newsItems.filter(n => !previousTitles.has(n.title));
    if (newItems.length > 0 && prevCount > 0) {
      showToast(`🔔 ${newItems.length} berita baru dari Lelemuku.com!`);
      // Animasikan marker baru
      newItems.slice(0, 3).forEach(n => {
        if (n.location) {
          const m = markers.find(m => m.news.id === n.id);
          if (m) m.marker.bounce?.();
        }
      });
    }
    previousTitles = new Set(newsItems.map(n => n.title));
  }, CONFIG.refreshInterval);
}

// ================================================================
// INIT
// ================================================================
window.addEventListener('DOMContentLoaded', async () => {
  initMap();
  await loadFeed();
  previousTitles = new Set(newsItems.map(n => n.title));
  setupAutoRefresh();
});
</script>
