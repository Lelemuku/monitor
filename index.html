/* ═══════════════════════════════════
   AD POPUP STYLING
═══════════════════════════════════ */

.ad-popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.ad-popup-modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  max-width: 420px;
  width: 100%;
  position: relative;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.ad-popup-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 10;
}

.ad-popup-close:hover {
  background: var(--surface3);
  color: var(--text);
  transform: rotate(90deg);
  border-color: var(--accent);
}

.ad-popup-content {
  padding: 16px;
  text-align: center;
  min-height: 250px;
}

.ad-popup-label {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text3);
  letter-spacing: 2px;
  text-transform: uppercase;
  display: block;
  margin-bottom: 12px;
}

.ad-popup-footer {
  padding: 10px 16px 16px;
  text-align: center;
  border-top: 1px solid var(--border);
}

.ad-popup-footer small {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
}

@media (max-width: 480px) {
  .ad-popup-modal {
    max-width: 340px;
  }
  .ad-popup-overlay {
    padding: 15px;
  }
}

/* ═══════════════════════════════════
   TEMA VARIABEL
═══════════════════════════════════ */
[data-theme="dark"] {
  --bg:          #06090f;
  --surface:     #0d1117;
  --surface2:    #161b24;
  --surface3:    #1c2333;
  --border:      rgba(255,255,255,0.07);
  --border2:     rgba(255,255,255,0.12);
  --text:        #c9d1d9;
  --text2:       #8b949e;
  --text3:       #3d4a5c;
  --white:       #f0f6fc;
  --shadow:      rgba(0,0,0,0.6);
  --overlay:     rgba(6,9,15,0.85);
  --tile-filter: brightness(0.9);
  --scan-color: rgba(0,0,0,0.025);
}
[data-theme="light"] {
  --bg:          #f0f4f8;
  --surface:     #ffffff;
  --surface2:    #f6f8fa;
  --surface3:    #eaeef2;
  --border:      rgba(0,0,0,0.08);
  --border2:     rgba(0,0,0,0.13);
  --text:        #24292f;
  --text2:       #57606a;
  --text3:       #8c959f;
  --white:       #1a1f28;
  --shadow:      rgba(0,0,0,0.15);
  --overlay:     rgba(240,244,248,0.85);
  --tile-filter: brightness(1) saturate(0.85);
  --scan-color: transparent;
}

:root {
  --red:     #f85149;
  --yellow:  #e3b341;
  --green:   #3fb950;
  --blue:    #58a6ff;
  --orange:  #f0883e;
  --accent:  #f0b429;
  --accent2: #e09921;
  --font-head: Georgia, "Times New Roman", serif;
  --font-body: Georgia, serif;
  --font-mono: "Courier New", monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}

#header {
  height: 50px;
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  display: flex;
  align-items: center;
  flex-shrink: 0;
  z-index: 1100;
  transition: background 0.3s, border-color 0.3s;
}

#logo-wrap {
  display: flex; align-items: center; gap: 9px;
  padding: 0 16px;
  border-right: 1px solid var(--border);
  height: 100%;
  text-decoration: none;
  flex-shrink: 0;
}
#logo-img {
  width: 26px; height: 26px; border-radius: 5px;
  object-fit: cover; background: var(--surface2);
}
#logo-name  { font-family: var(--font-head); font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing:.5px; }
#logo-tag   { font-size: 9px; color: var(--text3); letter-spacing:1.5px; text-transform:uppercase; line-height:1; }

#live-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 0 14px; border-right: 1px solid var(--border); height: 100%;
  font-family: var(--font-mono); font-size: 10px; color: var(--green); letter-spacing:1px;
  flex-shrink: 0;
}
.live-ring {
  width:7px; height:7px; border-radius:50%;
  background: var(--green); box-shadow: 0 0 5px var(--green);
  animation: liveRing 1.8s ease infinite;
}
@keyframes liveRing { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(.65);opacity:.35} }

#header-nav {
  display: flex; align-items: center; gap: 2px; padding: 0 8px;
  flex-shrink: 0;
}
.nav-btn {
  font-family: var(--font-mono); font-size: 10px; letter-spacing:1.5px;
  color: var(--text3); padding: 5px 10px; cursor: pointer;
  transition: all .2s; text-transform: uppercase; border-radius:4px;
  border: 1px solid transparent; background: none;
}
.nav-btn:hover { color: var(--text2); }
.nav-btn.active { color: var(--accent); border-color: rgba(240,180,41,.2); background: rgba(240,180,41,.06); }

#header-gap { flex: 1; }

#header-right {
  display: flex; align-items: center; height: 100%;
}
.hdr-stat {
  display: flex; align-items: center; gap: 4px;
  padding: 0 12px; border-left: 1px solid var(--border); height: 100%;
  font-family: var(--font-mono); font-size: 10px; color: var(--text3);
  white-space: nowrap; flex-shrink: 0;
}
.hdr-stat strong { color: var(--text2); }

#theme-toggle {
  display: flex; align-items: center; justify-content: center;
  width: 42px; height: 100%;
  border-left: 1px solid var(--border);
  cursor: pointer; font-size: 15px;
  transition: background .2s; flex-shrink: 0;
  background: none; border-top:none; border-right:none; border-bottom:none;
}
#theme-toggle:hover { background: rgba(240,180,41,.06); }

#wire-toggle-btn {

  border-left: 1px solid var(--border);
  cursor: pointer; font-size: 14px;
  background: none; border-top:none; border-right:none; border-bottom:none;
  color: var(--text2); transition: all .2s; flex-shrink: 0;
}
#wire-toggle-btn:hover { color: var(--accent); background: rgba(240,180,41,.06); }

#refresh-btn {
  display: flex; align-items: center; gap: 4px;
  height: 100%; padding: 0 13px;

}
#refresh-btn:hover { color: var(--accent); background: rgba(240,180,41,.05); }
#refresh-btn.spin svg { animation: iconSpin .8s linear infinite; }
@keyframes iconSpin { to { transform: rotate(360deg); } }

#clock {
  padding: 0 12px; border-left: 1px solid var(--border); height:100%;
  display: flex; align-items: center;
  font-family: var(--font-mono); font-size: 10px; color: var(--text3);
  white-space: nowrap; min-width: 142px; flex-shrink: 0;
}

#main {
  display: flex; flex: 1; overflow: hidden; min-height: 0; position: relative;
}

#sidebar {

  transition: background .3s, border-color .3s;

.sb-sec { border-bottom: 1px solid var(--border); padding: 8px 0; }

  padding: 8px 14px; font-family: var(--font-mono); font-size: 10px;
  letter-spacing:1.5px; color: var(--text3); cursor: pointer;
  transition: all .15s; text-transform: uppercase; user-select:none;
}
.sb-item:hover { color: var(--text); background: rgba(128,128,128,.06); }
.sb-item.active { color: var(--accent); }
.sb-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.sb-count { margin-left:auto; font-size:9px; color:var(--text3); }

#feed-status-box {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.fs-label { font-family: var(--font-mono); font-size:9px; letter-spacing:2px; color:var(--text3); text-transform:uppercase; margin-bottom:5px; }
.fs-row { display:flex; align-items:center; justify-content:space-between; }
.fs-text { font-family: var(--font-mono); font-size:9px; color:var(--text3); }
.fs-dot { width:6px; height:6px; border-radius:50%; background:var(--text3); }
.fs-bar { display:flex; gap:3px; margin-top:5px; }
.fs-seg { flex:1; height:3px; border-radius:2px; background:var(--surface3); transition: background .3s; }

#legend { padding:10px 14px; margin-top:auto; border-top:1px solid var(--border); }
.leg-label { font-family:var(--font-mono); font-size:9px; letter-spacing:2px; color:var(--text3); text-transform:uppercase; margin-bottom:7px; }
.leg-row { display:flex; align-items:center; gap:6px; margin:4px 0; font-size:11px; color:var(--text2); }
.leg-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

#map-wrap {
  flex:1; position:relative; min-width:0; overflow:hidden;
}
#map {
  width:100%; height:100%;

}

.leaflet-control-zoom {
  border: 1px solid var(--border2) !important;
  border-radius:6px !important; overflow:hidden; box-shadow:none !important;
}
.leaflet-control-zoom a {
  background: var(--surface) !important; color:var(--text2) !important;
  border-bottom:1px solid var(--border) !important;
  width:28px !important; height:28px !important; line-height:28px !important;
}
.leaflet-control-zoom a:hover { background:var(--surface2) !important; color:var(--accent) !important; }
.leaflet-control-attribution {

}

#map-chips {
  position:absolute; top:10px; left:48px; z-index:800;
  display:flex; flex-direction:column; gap:6px; pointer-events:none; align-items:flex-end;
}
.m-chip {
  background: var(--overlay); border:1px solid var(--border2);
  border-radius:5px; padding:4px 9px;
  font-family:var(--font-mono); font-size:9px; color:var(--text2);

}

  position:absolute; top:38px; left:48px; z-index:800;

}

#loading {
  position:absolute; inset:0;

}
#loading.hidden { opacity:0; pointer-events:none; }
.ld-spin {
  width:34px; height:34px; border:2px solid var(--border2);

}
.ld-txt { font-family:var(--font-mono); font-size:10px; color:var(--text3); letter-spacing:2px; text-transform:uppercase; }

#wire-panel {

              background .3s, border-color .3s;
}
#wire-panel.collapsed { width: 0; border-left-width:0; }

#wire-handle {
  position: absolute;
  top: 50%;

  width: 22px;

  border: 1px solid var(--border2);
  border-right: none;

  justify-content: center;

  z-index: 601;

  font-size: 11px;
}
#wire-handle:hover { background: var(--surface2); color: var(--accent); }

  display:flex; align-items:center; gap:5px; padding:0 11px;
  border-right:1px solid var(--border); height:100%;
  font-family:var(--font-mono); font-size:9px; color:var(--accent); letter-spacing:2px;
  flex-shrink:0; white-space:nowrap;
}
#ticker-wrap { flex:1; overflow:hidden; height:100%; position:relative; }
#ticker-track {
  display:flex; align-items:center; white-space:nowrap; height:100%;
  position:absolute; animation:tickerMove 90s linear infinite;
}
#ticker-track:hover { animation-play-state:paused; cursor:pointer; }
@keyframes tickerMove { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.tk-item {
  display:inline-flex; align-items:center; gap:6px; padding:0 18px;
  font-size:11px; color:var(--text2); border-right:1px solid var(--border);
  height:100%; transition:color .2s;
}
.tk-item:hover { color:var(--text); }
.tk-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }

#toast-zone {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  z-index:3000; display:flex; flex-direction:column; gap:5px;
  pointer-events:none; min-width:260px;
}
.toast {
  background:var(--surface2); border:1px solid var(--border2); border-radius:7px;
  padding:8px 13px; font-size:12px; color:var(--text);
  display:flex; align-items:center; gap:7px;
  box-shadow:0 4px 20px var(--shadow); animation:toastIn .25s ease;
  pointer-events:auto;
}
@keyframes toastIn { from{opacity:0;transform:translateY(-7px)} to{opacity:1;transform:translateY(0)} }
.toast.out { animation:toastOut .3s ease forwards; }
@keyframes toastOut { to{opacity:0;transform:translateY(-7px)} }
.toast.error  { border-left:3px solid var(--red); }
.toast.success{ border-left:3px solid var(--green); }
.toast.warn   { border-left:3px solid var(--yellow); }
.toast.info   { border-left:3px solid var(--blue); }

body::after {
  content:''; position:fixed; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,var(--scan-color) 3px,var(--scan-color) 4px);
  pointer-events:none; z-index:9999;
}

#error-bar {
  display:none; position:absolute; top:10px; left:50%; transform:translateX(-50%);
  z-index:2500; background:rgba(248,81,73,.12); border:1px solid rgba(248,81,73,.32);

}

@media (min-width: 769px) {

    width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border2);
    display: flex; flex-direction: column;
    flex-shrink: 0; overflow: hidden;

  }
  #wire-panel.collapsed { width: 0; border-left-width: 0; overflow: hidden; }
  #wire-handle {
    position: absolute; top: 50%; right: 0;

    background: var(--surface);
    border: 1px solid var(--border2); border-right: none;
    border-radius: 6px 0 0 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 601; color: var(--text3); font-size: 11px;
    transition: background .2s, color .2s;
    user-select: none;
  }
  #wire-handle:hover { background: var(--surface2); color: var(--accent); }
  #wire-panel.collapsed #wire-handle { right: -22px; border-right: 1px solid var(--border2); }
  #fab-filter, #fab-wire, #mob-backdrop { display: none !important; }
  #wire-toggle-btn { display: none; }

@media (max-width: 768px) {
  #sidebar { display: none !important; }
  #logo-tag, .hdr-stat, #clock { display: none !important; }
  #wire-desk-btn { display: none !important; }

    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 0;
    z-index: 1500;

    pointer-events: none;
  }
  #wire-outer.mob-open {
    height: 100%;
    pointer-events: auto;
  }
  #wire-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    width: 100% !important;
    height: 72vh;
    max-height: 72vh;
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    border-top: 2px solid var(--border2);
    border-left: none;
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.4,0,.2,1), background .3s;
    box-shadow: 0 -8px 32px var(--shadow);
  }
  #wire-outer.mob-open #wire-panel {
    transform: translateY(0);
  }
  #wire-drag-bar {
    display: block;
    width: 40px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 10px auto 0;
    flex-shrink: 0;
    cursor: pointer;
  }
  #wire-close-mobile { display: flex !important; }
  #wire-panel { flex-shrink: 0; }

  #fab-filter, #fab-wire { display: flex !important; }
